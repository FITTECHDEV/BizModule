<!-- =====================================================
     php.ini - Update these values to 90 minutes
     Location: C:\Program Files\PHP\v8.1\php.ini
     ===================================================== -->

; PHP Configuration for Large File Imports (10MB+ files)
; UPDATED: Increased to 90 minutes to handle very large imports
; Execution timeouts (5400 seconds = 90 minutes)
max_execution_time = 7200
max_input_time = 7200

; Memory and file size limits (INCREASED)
memory_limit = 2048M
post_max_size = 250M
upload_max_filesize = 250M

; Additional performance settings
max_input_vars = 10000
default_socket_timeout = 7200

; Error reporting (for debugging)
display_errors = Off
log_errors = On
error_log = "C:\inetpub\wwwroot\Projects\Production\erp_production\storage\logs\php-errors.log"

; Session settings
session.gc_maxlifetime = 7200

; Output buffering
output_buffering = 4096

; FastCGI specific settings
fastcgi.request_timeout = 5400
output_buffering = 4096
