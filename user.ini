; =====================================================
; PHP Configuration for Large File Imports
; Location: C:\php-8.1.23-Win32-vs16-x64\php.ini
; FIXED: 1 hour timeout (reduced from 2 hours)
; Last Updated: 2024
; =====================================================

; ============================================
; CRITICAL: EXECUTION & TIMEOUT SETTINGS (FIXED)
; Reduced from 7200 to 3600 - IIS has issues with values above 3600
; ============================================
max_execution_time = 3600
max_input_time = 3600
default_socket_timeout = 3600

; FastCGI specific timeout (MUST match IIS web.config)
fastcgi.request_timeout = 3600


; ============================================
; MEMORY & FILE SIZE LIMITS
; ============================================
memory_limit = 2048M
post_max_size = 250M
upload_max_filesize = 250M
max_file_uploads = 20


; ============================================
; INPUT & VARIABLE LIMITS
; ============================================
max_input_vars = 10000
max_input_nesting_level = 128


; ============================================
; ERROR REPORTING & LOGGING
; ============================================
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = "C:\inetpub\wwwroot\Projects\Production\erp_production\storage\logs\php-errors.log"
ignore_repeated_errors = On
ignore_repeated_source = Off
log_errors_max_len = 8192


; ============================================
; SESSION SETTINGS
; ============================================
session.gc_maxlifetime = 3600
session.cookie_lifetime = 3600
session.save_path = "C:\php-8.1.23-Win32-vs16-x64\tmp"
session.name = PHPSESSID
session.gc_probability = 1
session.gc_divisor = 1000


; ============================================
; OUTPUT BUFFERING
; ============================================
output_buffering = 4096
implicit_flush = Off
zlib.output_compression = Off


; ============================================
; FILE UPLOAD SETTINGS
; ============================================
file_uploads = On
upload_tmp_dir = "C:\php-8.1.23-Win32-vs16-x64\tmp"


; ============================================
; DATABASE SETTINGS
; ============================================
mysqli.default_socket = ""
mysqli.max_links = -1
mysqli.reconnect = Off
mysqli.allow_local_infile = On
pdo_mysql.default_socket = ""


; ============================================
; PERFORMANCE & CACHING
; ============================================
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1


; ============================================
; TIMEZONE SETTINGS
; ============================================
date.timezone = "Africa/Nairobi"


; ============================================
; REQUIRED PHP EXTENSIONS FOR LARAVEL
; ============================================
extension=curl
extension=fileinfo
extension=gd
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=mysqli
extension=zip
extension=intl
extension=xml
extension=xmlreader
extension=xmlwriter
extension=simplexml
extension=dom
extension=soap
extension=exif
extension=sodium
extension=bcmath


; ============================================
; SECURITY SETTINGS
; ============================================
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,show_source
allow_url_fopen = On
allow_url_include = Off
expose_php = Off
magic_quotes_gpc = Off


; ============================================
; WINDOWS-SPECIFIC SETTINGS
; ============================================
extension_dir = "C:\php-8.1.23-Win32-vs16-x64\ext"
include_path = ".;C:\php-8.1.23-Win32-vs16-x64\pear"


; ============================================
; FASTCGI/CGI SETTINGS
; ============================================
fastcgi.logging = 1
fastcgi.impersonate = 1
cgi.fix_pathinfo = 0
cgi.force_redirect = 0


; ============================================
; MISC SETTINGS
; ============================================
default_mimetype = "text/html"
default_charset = "UTF-8"
short_open_tag = Off
precision = 14
serialize_precision = -1
